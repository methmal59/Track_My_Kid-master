apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.project.dreamsquad.trackmykid"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 10
        versionName "1.1.9"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true

    }


//    productFlavors {
//        dev {
//            // Enable pre-dexing to produce an APK that can be tested on
//            // Android 5.0+ without the time-consuming DEX build processes.
//            minSdkVersion 19
//        }
//        prod {
//            // The actual minSdkVersion for the production version.
//            minSdkVersion 15
//        }
//    }

    buildTypes {
        release {
//            shrinkResources true

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }
}



repositories {

    maven { url "https://jitpack.io" }
    jcenter()
    maven {
        url 'https://maven.google.com'
    }

}

dependencies {
    implementation "com.google.android.gms:play-services-tagmanager:12.0.1"
    implementation 'com.google.firebase:firebase-core:16.0.9'
    implementation 'com.google.firebase:firebase-database:16.0.6'
    implementation 'com.google.firebase:firebase-messaging:17.3.4'


    implementation 'com.google.firebase:firebase-auth:19.0.0'
    implementation 'com.google.android.gms:play-services-analytics:12.0.1'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:percent:28.0.0'
//    implementation 'com.google.android.gms:play-services:12.0.1'
    implementation 'com.android.support:support-vector-drawable:28.0.0'
    implementation 'de.hdodenhof:circleimageview:2.2.0'
//    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'devs.mulham.horizontalcalendar:horizontalcalendar:1.1.5'
    //implementation 'com.android.support.constraint:constraint-layout:1.0.2'
//    implementation 'com.android.support:multidex:1.0.3'
    releaseImplementation 'com.google.firebase:firebase-crash:16.2.1'


    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.squareup.okhttp3:okhttp-ws:3.4.1'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.4.1'
    implementation 'com.squareup.retrofit2:retrofit:2.1.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.1.0'
    implementation 'com.android.support:multidex:1.0.0'
    implementation 'com.android.support:design:28.0.0'
//    implementation 'com.google.android.gms:play-services:12.0.1'
    compile 'com.squareup.okhttp3:okhttp-ws:3.4.1'
    compile 'com.squareup.okhttp3:okhttp-urlconnection:3.4.1'
    compile 'com.squareup.retrofit2:retrofit:2.1.0'
    compile 'com.squareup.retrofit2:converter-jackson:2.1.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    testCompile 'junit:junit:4.12'
    testCompile 'org.robolectric:robolectric:3.0'

    implementation 'com.google.android.gms:play-services-maps:12.0.1'
    implementation 'com.google.android.gms:play-services-location:12.0.1'
//    implementation 'com.google.android.gms:play-services-places:12.0.1'
    implementation 'com.google.android.libraries.places:places:1.0.0'

//    implementation 'com.google.android.libraries.places:places-compat:2.0.0'


//    implementation 'com.google.firebase:firebase-database:16.0.1:15.0.0'
}

if (getGradle().getStartParameter().getTaskRequests().toString().contains('Google')) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'io.fabric'

    task copyJson(type: Copy) {
        from '../../traccar-shared/google-services'
        into '.'
        include 'traccar-manager-android.json'
        rename('traccar-manager-android.json', 'google-services.json')
    }

    afterEvaluate {
        preBuild.dependsOn copyJson
    }
}

apply plugin: 'com.google.gms.google-services'
